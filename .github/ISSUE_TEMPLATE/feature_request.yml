name: Feature request
description: Propose new behavior or a new option
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >-
        What are you unable to do today, and what did you try instead? Describe the situation,
        not the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: If you have a specific shape in mind (a flag, an option, an output format), show it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you considered and rejected
      description: >-
        Including "configure it in my own wrapper" or "do nothing". New surface area has to
        beat those.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This can be done without adding a runtime dependency
        - label: I am willing to open a PR for it
